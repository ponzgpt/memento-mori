name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "release/**"

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify release
        run: npm run verify

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memento-mori-artifacts-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
