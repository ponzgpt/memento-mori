name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "release/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify release
        run: npm run verify

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memento-mori-artifacts
          path: dist/*
          if-no-files-found: error
