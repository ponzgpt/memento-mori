name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "release/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Check installers
        run: npm run check:installers

      - name: Test
        run: npm test

      - name: Waybar smoke
        run: |
          python3 -m py_compile waybar/memento.py
          python3 waybar/memento.py --config config/profile.example.json

      - name: Package release artifacts
        run: npm run package

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memento-mori-artifacts
          path: dist/*
          if-no-files-found: error
