# The whole app is a handful of small static files, so correctness after a
# release matters far more than shaving a request: everything is served
# no-store. Without this, a visitor who loaded the site before a deploy can
# keep a stale main.js/styles.css indefinitely on nothing but browser
# heuristic caching -no explicit header required for that to happen- which
# is exactly what happened on the 2026-09-09 release. The local dev server
# (scripts/serve.mjs) already does this; production was the gap.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
